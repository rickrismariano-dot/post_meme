name: Random meme to Discord

on:
  schedule:
    # 00:00 and 12:00 UTC = 08:00 and 20:00 in Manila. GitHub may start it 10 to 30 minutes late.
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the meme in the log, do not post"
        type: boolean
        default: false

jobs:
  meme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post a meme
        env:
          # Uses MEME_WEBHOOK_URL if you made one, otherwise falls back to the Epic bot's webhook.
          WEBHOOK_URL: ${{ secrets.MEME_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: python post_meme.py ${{ inputs.dry_run && '--dry-run' || '' }}
